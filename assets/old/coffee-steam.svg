<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 18 18" shape-rendering="crispEdges">
  <!-- Steaming CS professor coffee mug -->
  <!-- Animated steam wisps -->
  <g fill="#666666">
    <rect x="5" y="2" width="1" height="2">
      <animate attributeName="y" values="3;1;2;3" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="0.3;1;0.6;0.3" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="8" y="1" width="1" height="3">
      <animate attributeName="y" values="2;0;1;2" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0.4;0.9;1" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="11" y="2" width="1" height="2">
      <animate attributeName="y" values="1;3;2;1" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="0.5;1;0.3;0.5" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>
  <!-- Mug handle -->
  <rect x="13" y="8" width="3" height="1" fill="#000000"/>
  <rect x="15" y="9" width="1" height="4" fill="#000000"/>
  <rect x="13" y="13" width="3" height="1" fill="#000000"/>
  <rect x="13" y="9" width="2" height="1" fill="#ffffff"/>
  <rect x="14" y="10" width="1" height="2" fill="#ffffff"/>
  <rect x="13" y="12" width="2" height="1" fill="#cccccc"/>
  <!-- Mug body -->
  <rect x="3" y="6" width="10" height="9" fill="#000000"/>
  <rect x="4" y="7" width="8" height="7" fill="#ffffff"/>
  <rect x="4" y="7" width="8" height="2" fill="#5c3317"/>
  <rect x="5" y="7" width="2" height="1" fill="#8b5a2b"/>
  <!-- Mug shading & HUJI stripe -->
  <rect x="4" y="10" width="8" height="2" fill="#000080"/>
  <rect x="5" y="10" width="1" height="2" fill="#ffff00"/>
  <rect x="7" y="10" width="1" height="2" fill="#ffff00"/>
  <rect x="9" y="10" width="1" height="2" fill="#ffff00"/>
  <rect x="10" y="9" width="2" height="5" fill="#cccccc" opacity="0.45"/>
  <!-- Saucer -->
  <rect x="2" y="15" width="12" height="1" fill="#000000"/>
  <rect x="3" y="16" width="10" height="1" fill="#808080"/>
</svg>
