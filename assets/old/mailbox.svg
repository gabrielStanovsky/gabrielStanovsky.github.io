<svg xmlns="http://www.w3.org/2000/svg" width="32" height="26" viewBox="0 0 16 13" shape-rendering="crispEdges">
  <!-- Classic 90s Email Mailbox with flipping red flag -->
  <!-- Post -->
  <rect x="7" y="9" width="2" height="4" fill="#663300"/>
  <rect x="8" y="9" width="1" height="4" fill="#996633"/>
  <!-- Mailbox body -->
  <rect x="3" y="4" width="10" height="5" fill="#000080"/>
  <rect x="4" y="3" width="8" height="1" fill="#000080"/>
  <rect x="4" y="4" width="7" height="1" fill="#6699ff"/>
  <rect x="3" y="5" width="3" height="4" fill="#333333"/>
  <!-- Popping white envelope -->
  <g>
    <rect x="1" y="5" width="4" height="3" fill="#ffffff" stroke="#000000" stroke-width="0.5">
      <animate attributeName="x" values="2;0;2" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <line x1="1" y1="5" x2="3" y2="7" stroke="#ff0000" stroke-width="0.6">
      <animate attributeName="x1" values="2;0;2" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="x2" values="4;2;4" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </line>
  </g>
  <!-- Animated Red Flag -->
  <g>
    <rect x="10" y="1" width="1" height="5" fill="#ff0000">
      <animate attributeName="height" values="5;2;5" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="y" values="1;4;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="11" y="1" width="3" height="2" fill="#ff0000">
      <animate attributeName="y" values="1;4;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>
</svg>
