<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 18 18" shape-rendering="crispEdges">
  <!-- Classic 90s spinning wireframe WWW globe -->
  <circle cx="9" cy="9" r="8" fill="#003366" stroke="#000000" stroke-width="1"/>
  <ellipse cx="9" cy="9" rx="7" ry="7" fill="#006699"/>
  <!-- Highlight -->
  <rect x="5" y="3" width="2" height="1" fill="#66ccff"/>
  <rect x="4" y="4" width="2" height="2" fill="#66ccff"/>
  <!-- Latitude grid lines -->
  <line x1="2" y1="6" x2="16" y2="6" stroke="#00cccc" stroke-width="0.8"/>
  <line x1="1" y1="9" x2="17" y2="9" stroke="#00ffff" stroke-width="0.9"/>
  <line x1="2" y1="12" x2="16" y2="12" stroke="#00cccc" stroke-width="0.8"/>
  <!-- Animated rotating meridians + continents -->
  <g>
    <ellipse cx="9" cy="9" rx="3" ry="7.5" fill="none" stroke="#00ffff" stroke-width="0.8">
      <animate attributeName="rx" values="1;4;7;4;1" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="9" cy="9" rx="6" ry="7.5" fill="none" stroke="#00cccc" stroke-width="0.7">
      <animate attributeName="rx" values="6;2;5;7;6" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <g fill="#33cc33">
      <rect x="4" y="5" width="3" height="2">
        <animate attributeName="x" values="3;6;10;12;3" dur="2.4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
      <rect x="6" y="7" width="3" height="3">
        <animate attributeName="x" values="5;8;11;4;5" dur="2.4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
      <rect x="10" y="10" width="3" height="2">
        <animate attributeName="x" values="11;6;3;9;11" dur="2.4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </g>
  </g>
  <!-- Crisp outer border -->
  <circle cx="9" cy="9" r="7.5" fill="none" stroke="#000033" stroke-width="1"/>
</svg>
