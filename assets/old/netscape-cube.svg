<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 14 14" shape-rendering="crispEdges">
  <!-- Classic Netscape-style spinning N beacon -->
  <rect x="0" y="0" width="14" height="14" fill="#004455" stroke="#000000" stroke-width="1"/>
  <rect x="1" y="1" width="12" height="12" fill="#006677"/>
  <!-- Twinkling pixel stars -->
  <rect x="2" y="2" width="1" height="1" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <rect x="11" y="3" width="1" height="1" fill="#99ffff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <rect x="10" y="11" width="1" height="1" fill="#ffff99">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <!-- Horizon glow -->
  <rect x="1" y="11" width="12" height="2" fill="#003344"/>
  <!-- Crisp pixel N -->
  <rect x="3" y="3" width="2" height="8" fill="#ffffff"/>
  <rect x="9" y="3" width="2" height="8" fill="#ffffff"/>
  <rect x="5" y="4" width="1" height="2" fill="#ffffff"/>
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="8" y="8" width="1" height="2" fill="#ffffff"/>
</svg>
