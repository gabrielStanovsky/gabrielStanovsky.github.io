<svg xmlns="http://www.w3.org/2000/svg" width="38" height="16" viewBox="0 0 38 16" shape-rendering="crispEdges">
  <g>
    <rect x="0" y="0" width="38" height="16" fill="#ff0000">
      <animate attributeName="fill" values="#ff0000;#ffff00;#ff0000" dur="0.7s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="1" y="1" width="36" height="14" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="19" y="12" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#ffff00">
      NEW!
      <animate attributeName="fill" values="#ffff00;#ff0000;#ffff00" dur="0.7s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
  </g>
</svg>
