<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 18 18" shape-rendering="crispEdges">
  <!-- Classic 90s yellow diamond Under Construction sign with blinking hazard cone -->
  <polygon points="9,1 17,9 9,17 1,9" fill="#ffcc00" stroke="#000000" stroke-width="1"/>
  <polygon points="9,2.6 15.4,9 9,15.4 2.6,9" fill="none" stroke="#000000" stroke-width="0.6"/>
  <!-- Little pixel worker + shovel -->
  <rect x="8" y="4" width="2" height="2" fill="#000000"/>
  <rect x="7" y="6" width="3" height="3" fill="#000000"/>
  <rect x="6" y="9" width="2" height="3" fill="#000000"/>
  <rect x="9" y="9" width="2" height="3" fill="#000000"/>
  <!-- Animated shovel & dirt pile -->
  <g>
    <rect x="10" y="7" width="3" height="1" fill="#000000">
      <animate attributeName="y" values="7;8;7" dur="0.8s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="12" y="8" width="2" height="2" fill="#000000">
      <animate attributeName="y" values="8;9;8" dur="0.8s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>
  <rect x="11" y="11" width="3" height="2" fill="#663300"/>
  <!-- Blinking top light -->
  <rect x="8" y="1" width="2" height="1" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ffff00;#ff0000" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
</svg>
